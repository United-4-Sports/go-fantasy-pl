name: Release

# Cuts a release by reading the VERSION file: bump VERSION in a PR, merge,
# and this workflow gates the build, tags v<VERSION>, and publishes a
# GitHub release with generated notes.
#
# Publishing decisions live in .github/scripts/release-plan.sh so they can
# be scenario-tested locally (test-release-plan.sh) instead of verified by
# running a real release:
#
#   tag      release   outcome
#   absent   -         tag HEAD and publish the release
#   present  absent    publish the release for the existing tag when the tag
#                      is HEAD or an ancestor of HEAD (a previous publish
#                      half-failed); the tagged artifact ships, HEAD is not
#                      re-tagged
#   present  present   intentional no-op (merging without a bump)
#   present, foreign to HEAD's history   fail for human review
#
# An existing tag is never moved or re-pointed silently.
#
# Tags are only the published form of a release — Go consumers can also pin
# any untagged commit or branch directly:
#
#   go get github.com/AbdoAnss/go-fantasy-pl@main          # pseudo-version
#   go get github.com/AbdoAnss/go-fantasy-pl@<commit-sha>

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  toolchain:
    name: Resolve supported toolchains
    if: github.ref == 'refs/heads/main' # manual dispatches are main-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: versions
        name: Collect minimum (go.mod) and current Go versions
        shell: bash
        run: |
          min_go="$(awk '$1 == "go" { print $2 }' go.mod)"
          if ! [[ "$min_go" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse a go directive from go.mod (got '$min_go')"
            exit 1
          fi
          # A release must build on every toolchain the project claims to
          # support: the minimum declared in go.mod and current stable.
          echo "versions=[\"$min_go\",\"stable\"]" >> "$GITHUB_OUTPUT"

  gate:
    name: Publication gate (${{ matrix.go-version }})
    needs: toolchain
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(needs.toolchain.outputs.versions) }}
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
    with:
      go-version: ${{ matrix.go-version }}

  tag:
    name: Tag and publish VERSION
    needs: [toolchain, gate]
    if: github.ref == 'refs/heads/main' # manual dispatches are main-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # only the publishing job needs write scope
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so existing tags are visible

      - id: plan
        name: Decide what to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-plan.sh

      - name: Push tag
        if: steps.plan.outputs.decision == 'tag_and_publish'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "go-fantasy-pl ${RELEASE_TAG}"
          git push origin "$RELEASE_TAG"

      # Covers both first publication and recovery for an existing tag;
      # --verify-tag refuses to invent a tag, and --generate-notes derives
      # notes from the tag itself, so a recovery ships the tagged artifact.
      - name: Publish GitHub release
        if: steps.plan.outputs.decision == 'tag_and_publish' || steps.plan.outputs.decision == 'publish_release_for_existing_tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
