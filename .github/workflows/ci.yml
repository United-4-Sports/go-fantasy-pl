name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Schema conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      # Hermetic schema conformance: validates our models against the
      # committed API captures (unmapped keys, orphaned fields, fidelity).
      # Failures here mean the FPL API schema drifted relative to
      # testdata/ — update the models or the allowlists, then `make recapture`.
      - name: Run schema conformance suite
        run: |
          go test -race -count=1 -run "Schema" ./endpoints/ -v
          go test -race -count=1 ./internal/conformance/

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The secrets context is not available in step-level if: conditions, so
    # the Codecov token is surfaced through job env instead.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module files are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      # go fix's modernizer set tracks the toolchain, and go.mod's version
      # floor (resolved by go-version-file above) can lag it — pin the
      # newest Go so this gate actually catches new modernizations.
      - name: Set up Go 1.27 for go fix gate
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Verify go fix is clean
        run: |
          go version
          make fix-check

      - name: Run vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        run: go build ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: go-fantasy-pl
          fail_ci_if_error: true

  deploy:
    name: Trigger Deployment
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
    steps:
      - name: Skip deployment when webhook is not configured
        if: ${{ env.DEPLOY_WEBHOOK_URL == '' }}
        run: echo "DEPLOY_WEBHOOK_URL is not configured; skipping deployment trigger."

      - name: Trigger deployment webhook
        if: ${{ env.DEPLOY_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail

          auth_args=()
          if [[ -n "${DEPLOY_WEBHOOK_TOKEN}" ]]; then
            auth_args=(-H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}")
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            "${auth_args[@]}" \
            -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}" \
            "${DEPLOY_WEBHOOK_URL}"
