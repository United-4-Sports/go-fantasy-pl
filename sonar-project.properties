# SonarCloud (SonarQube Cloud) analysis configuration.
# Project key follows SonarCloud's import convention: <org>_<repo>.
# Verify these two values match what SonarCloud shows under
# Administration > Project Key after importing the repository.
sonar.projectKey=United-4-Sports_go-fantasy-pl
sonar.organization=united-4-sports

sonar.sources=.
sonar.exclusions=**/*_test.go,endpoints/testdata/**,examples/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go coverage profile from `go test -coverprofile`; SonarGo reads the
# native format directly, no conversion to XML needed.
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
